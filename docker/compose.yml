services:
  postgres:
    image: postgres:18-alpine
    container_name: itc-memory-postgres
    restart: unless-stopped
    ports:
      - '127.0.0.1:${ITC_MEMORY_POSTGRES_PORT:-5432}:5432'
    environment:
      POSTGRES_DB: ${ITC_MEMORY_POSTGRES_DB}
      POSTGRES_USER: ${ITC_MEMORY_POSTGRES_USER}
      POSTGRES_PASSWORD: ${ITC_MEMORY_POSTGRES_PASSWORD}
    volumes:
      # PostgreSQL 18 stores its cluster in a versioned child directory.
      - ./postgres/data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
